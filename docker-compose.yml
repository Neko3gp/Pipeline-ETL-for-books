services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dos "puertas": 29092 para los contenedores (Airflow), 9092 para tu Mac
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"

  airflow:
    image: apache/airflow:3.1.8
    depends_on:
      - kafka
      - mongodb
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"                 # panel limpio, sin DAGs de ejemplo
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"   # el DAG corre solo, sin activarlo a mano
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True" # entrar al panel sin usuario ni contraseña
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python requests pymongo beautifulsoup4"
    volumes:
      - ./dags:/opt/airflow/dags
    command: standalone

  streamlit:
    image: python:3.12-slim
    depends_on:
      - mongodb
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit:/app
    command: sh -c "pip install -q streamlit pymongo pandas && streamlit run /app/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"
